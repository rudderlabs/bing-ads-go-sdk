version: "2"

run:
  timeout: 7m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - decorder
    - depguard
    - makezero
    - misspell
    - nilerr
    - nilnil
    - rowserrcheck
    - unconvert
    - unparam
    - usetesting
    - wastedassign
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
            - "!**/uuid_test.go"
          deny:
            - pkg: "github.com/gofrs/uuid"
              desc: 'use github.com/google/uuid instead'
            - pkg: "golang.org/x/exp/slices"
              desc: 'use "slices" instead'
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
